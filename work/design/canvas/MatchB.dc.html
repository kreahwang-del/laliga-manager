<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>경기 B 가로 피치와 통합 시트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2A93B}a:hover{color:#FFC46B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1419; color: #E8EEF2; font-family: 'IBM Plex Sans KR', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px">
    <span style="font-size: 13px; font-weight: 700; width: 110px">카스텔로</span>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">1 : 0</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 15px; color: {{accent}}; font-weight: 700">63' · 일시정지</span>
    </div>
    <span style="font-size: 13px; font-weight: 700; width: 110px; text-align: right">리베라 시티</span>
  </div>
  <div style="position: relative; margin: 4px 0 0; height: 236px; background: #1C4A35; overflow: hidden" role="img" aria-label="경기 진행 2D 피치 가로">
    <div style="position: absolute; left: 8px; right: 8px; top: 8px; bottom: 8px; border: 2px solid rgba(255,255,255,.35)"></div>
    <div style="position: absolute; left: 194px; top: 8px; bottom: 8px; width: 2px; background: rgba(255,255,255,.35)"></div>
    <div style="position: absolute; left: 160px; top: 84px; width: 68px; height: 68px; border-radius: 36px; border: 2px solid rgba(255,255,255,.35)"></div>
    <div style="position: absolute; left: 8px; top: 64px; width: 52px; height: 108px; border: 2px solid rgba(255,255,255,.35); border-left: 0"></div>
    <div style="position: absolute; right: 8px; top: 64px; width: 52px; height: 108px; border: 2px solid rgba(255,255,255,.35); border-right: 0"></div>
    <sc-for list="{{home}}" as="p" hint-placeholder-count="11">
      <span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 22px; height: 22px; border-radius: 11px; background: #2E6B5E; border: 2px solid #E7D7A8; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box">{{p.n}}</span>
    </sc-for>
    <sc-for list="{{away}}" as="p" hint-placeholder-count="11">
      <span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 22px; height: 22px; border-radius: 11px; background: #4A3F7A; border: 2px solid #F0B7A4; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box">{{p.n}}</span>
    </sc-for>
    <span style="position: absolute; left: 262px; top: 96px; width: 9px; height: 9px; border-radius: 5px; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(242,169,59,.6)"></span>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 330px; background: #17212A; border-top-left-radius: 16px; border-top-right-radius: 16px; border-top: 1px solid #2A3A47; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 4px; border-radius: 2px; background: #3A4C5A"></span></div>
    <div style="display: flex; align-items: center; padding: 8px 16px 0">
      <div role="tablist" style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #0E1419">
        <button role="tab" aria-selected="true" style="height: 40px; border-radius: 9px; border: 0; background: #2A3A47; color: #E8EEF2; font-size: 13px; font-weight: 700; font-family: inherit">지시</button>
        <button role="tab" aria-selected="false" style="height: 40px; border-radius: 9px; border: 0; background: transparent; color: #9AAAB6; font-size: 13px; font-family: inherit">전술</button>
        <button role="tab" aria-selected="false" style="height: 40px; border-radius: 9px; border: 0; background: transparent; color: #9AAAB6; font-size: 13px; font-family: inherit">교체 <span style="font-family: 'Barlow Condensed', sans-serif">5</span></button>
      </div>
      <button aria-label="닫고 경기 재개" style="width: 44px; height: 44px; margin-left: 8px; border-radius: 12px; border: 1px solid #2A3A47; background: transparent; color: #E8EEF2; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div style="padding: 14px 16px 0; font-size: 12px; font-weight: 700; color: #9AAAB6">터치라인 지시</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 8px 16px 0">
      <button style="min-height: 56px; padding: 8px 12px; border-radius: 12px; border: 1px solid #2A3A47; background: #1F2C37; color: #E8EEF2; font-family: inherit; text-align: left"><div style="font-size: 15px; font-weight: 700">더 올라가!</div><div style="font-size: 12px; color: #9AAAB6">공격적 성향</div></button>
      <button style="min-height: 56px; padding: 8px 12px; border-radius: 12px; border: 2px solid {{accent}}; background: #241E14; color: #E8EEF2; font-family: inherit; text-align: left"><div style="font-size: 15px; font-weight: 700">라인 내려!</div><div style="font-size: 12px; color: #F2C46B">적용 중 · 수비적 성향</div></button>
      <button style="min-height: 56px; padding: 8px 12px; border-radius: 12px; border: 1px solid #2A3A47; background: #1F2C37; color: #E8EEF2; font-family: inherit; text-align: left"><div style="font-size: 15px; font-weight: 700">침착하게</div><div style="font-size: 12px; color: #9AAAB6">균형 성향</div></button>
      <button style="min-height: 56px; padding: 8px 12px; border-radius: 12px; border: 1px solid #2A3A47; background: #1F2C37; color: #E8EEF2; font-family: inherit; text-align: left"><div style="font-size: 15px; font-weight: 700">정신 차려!</div><div style="font-size: 12px; color: #9AAAB6">기세 + · 남은 2번</div></button>
    </div>
    <div style="padding: 16px 16px 0; font-size: 12px; font-weight: 700; color: #9AAAB6">공격 집중 방향</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 8px 16px 0; padding: 4px; border-radius: 12px; background: #0E1419">
      <button style="height: 40px; border-radius: 9px; border: 0; background: #2A3A47; color: #E8EEF2; font-size: 13px; font-weight: 700; font-family: inherit">자동</button>
      <button style="height: 40px; border-radius: 9px; border: 0; background: transparent; color: #9AAAB6; font-size: 13px; font-family: inherit">왼쪽</button>
      <button style="height: 40px; border-radius: 9px; border: 0; background: transparent; color: #9AAAB6; font-size: 13px; font-family: inherit">중앙</button>
      <button style="height: 40px; border-radius: 9px; border: 0; background: transparent; color: #9AAAB6; font-size: 13px; font-family: inherit">오른쪽</button>
    </div>
    <div style="margin: 16px 16px 0; padding: 12px; border-radius: 12px; background: #0E1419; border: 1px solid #22303B; display: flex; align-items: center; gap: 10px">
      <span style="width: 32px; height: 32px; border-radius: 10px; background: #241E14; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 3l2.5 6H21l-5 4 2 7-6-4-6 4 2-7-5-4h6.5z"></path></svg></span>
      <div style="flex: 1"><div style="font-size: 13px; font-weight: 700">승부처 지시 · 남은 2번</div><div style="font-size: 12px; color: #9AAAB6">프리킥·코너킥·박스·측면·수비 순간에 멈춥니다</div></div>
      <button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A3A47; background: transparent; color: #C9D4DC; font-size: 12px; font-family: inherit">끄기</button>
    </div>
    <div style="margin-top: auto; padding: 12px 16px 20px">
      <button style="width: 100%; height: 52px; border-radius: 14px; border: 0; background: {{accent}}; color: #1A1206; font-size: 17px; font-weight: 700; font-family: inherit">경기 재개</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2A93B","options":["#F2A93B","#4FB8C9","#8E7CF0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const home = [[14,107,1],[60,30,2],[50,82,4],[50,132,5],[60,184,3],[118,60,8],[104,107,6],[130,156,10],[220,36,11],[244,104,9],[214,178,7]].map(([x,y,n]) => ({ x, y, n }));
    const away = [[354,107,1],[300,34,2],[312,84,4],[312,130,5],[300,180,3],[270,76,6],[266,140,8],[232,58,11],[196,112,10],[230,166,7],[160,100,9]].map(([x,y,n]) => ({ x, y, n }));
    return { accent: this.props.accent ?? '#F2A93B', home, away };
  }
}
</script>
</body>
</html>
