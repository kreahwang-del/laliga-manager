<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>경기 A 세로 피치</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2A93B}a:hover{color:#FFC46B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1419; color: #E8EEF2; font-family: 'IBM Plex Sans KR', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px">
    <div style="display: flex; align-items: center; gap: 8px; width: 120px">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #2E6B5E; border: 2px solid #E7D7A8"></span>
      <span style="font-size: 13px; font-weight: 700">카스텔로</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">1 : 0</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 15px; color: {{accent}}; font-weight: 700">63'</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; width: 120px">
      <span style="font-size: 13px; font-weight: 700">리베라</span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #4A3F7A; border: 2px solid #F0B7A4"></span>
    </div>
  </div>
  <div style="position: relative; margin: 4px 16px 0; height: 440px; border-radius: 14px; background: #1C4A35; overflow: hidden" role="img" aria-label="경기 진행 2D 피치">
    <div style="position: absolute; inset: 10px; border: 2px solid rgba(255,255,255,.35); border-radius: 4px"></div>
    <div style="position: absolute; left: 10px; right: 10px; top: 219px; height: 2px; background: rgba(255,255,255,.35)"></div>
    <div style="position: absolute; left: 139px; top: 180px; width: 76px; height: 76px; border-radius: 40px; border: 2px solid rgba(255,255,255,.35)"></div>
    <div style="position: absolute; left: 89px; top: 10px; width: 180px; height: 64px; border: 2px solid rgba(255,255,255,.35); border-top: 0"></div>
    <div style="position: absolute; left: 89px; bottom: 10px; width: 180px; height: 64px; border: 2px solid rgba(255,255,255,.35); border-bottom: 0"></div>
    <sc-for list="{{home}}" as="p" hint-placeholder-count="11">
      <span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 26px; height: 26px; border-radius: 13px; background: #2E6B5E; border: 2px solid #E7D7A8; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box">{{p.n}}</span>
    </sc-for>
    <sc-for list="{{away}}" as="p" hint-placeholder-count="11">
      <span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 26px; height: 26px; border-radius: 13px; background: #4A3F7A; border: 2px solid #F0B7A4; color: #FFFFFF; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box">{{p.n}}</span>
    </sc-for>
    <span style="position: absolute; left: 196px; top: 128px; width: 10px; height: 10px; border-radius: 5px; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(242,169,59,.6)"></span>
    <div style="position: absolute; left: 12px; right: 12px; bottom: 16px; padding: 8px 12px; border-radius: 10px; background: rgba(14,20,25,.82); font-size: 13px; text-align: center">9 오르테가, 오른쪽 측면으로 침투 패스</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; margin: 12px 16px 0">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9AAAB6"><span style="width: 34px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; color: #E8EEF2">56%</span><div style="flex: 1; height: 6px; border-radius: 3px; background: #4A3F7A; overflow: hidden"><div style="width: 56%; height: 6px; background: #3E9C84"></div></div><span style="width: 34px; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; color: #E8EEF2">44%</span><span style="width: 40px">점유</span></div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9AAAB6"><span style="width: 34px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; color: #E8EEF2">1.42</span><div style="flex: 1; height: 6px; border-radius: 3px; background: #4A3F7A; overflow: hidden"><div style="width: 68%; height: 6px; background: #3E9C84"></div></div><span style="width: 34px; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; color: #E8EEF2">0.66</span><span style="width: 40px">xG</span></div>
  </div>
  <div style="margin: 12px 16px 0; padding: 10px 12px; border-radius: 12px; background: #17212A; border: 1px solid #2A3A47; font-size: 13px; display: flex; flex-direction: column; gap: 6px">
    <div><b style="font-family: 'Barlow Condensed', sans-serif; color: {{accent}}">58'</b> <span style="padding: 1px 6px; border-radius: 6px; background: #3A2F14; color: #F2C46B; font-size: 12px; font-weight: 700">골</span> 오르테가 · 도움 비달레</div>
    <div style="color: #9AAAB6"><b style="font-family: 'Barlow Condensed', sans-serif">51'</b> 리베라 슈팅 · 골키퍼 선방</div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 20px; display: grid; grid-template-columns: 64px repeat(2, minmax(0, 1fr)) 96px; gap: 8px; background: #0E1419; border-top: 1px solid #1F2C37">
    <button style="height: 48px; border-radius: 12px; border: 1px solid #2A3A47; background: #17212A; color: #E8EEF2; font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700">×4</button>
    <button style="height: 48px; border-radius: 12px; border: 1px solid #2A3A47; background: #17212A; color: #E8EEF2; font-size: 13px; font-weight: 700; font-family: inherit">지시</button>
    <button style="height: 48px; border-radius: 12px; border: 1px solid #2A3A47; background: #17212A; color: #E8EEF2; font-size: 13px; font-weight: 700; font-family: inherit">전술·교체 <span style="font-family: 'Barlow Condensed', sans-serif; color: {{accent}}">5</span></button>
    <button style="height: 48px; border-radius: 12px; border: 0; background: {{accent}}; color: #1A1206; font-size: 13px; font-weight: 700; font-family: inherit">결과 보기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2A93B","options":["#F2A93B","#4FB8C9","#8E7CF0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const home = [[166,404,1],[52,340,2],[124,356,4],[208,356,5],[280,340,3],[96,270,8],[166,286,6],[236,262,10],[72,176,11],[166,150,9],[262,170,7]].map(([x,y,n]) => ({ x, y, n }));
    const away = [[166,14,1],[60,74,2],[128,60,4],[204,60,5],[272,78,3],[130,112,6],[204,118,8],[80,168,11],[166,196,10],[250,182,7],[166,236,9]].map(([x,y,n]) => ({ x, y, n }));
    return { accent: this.props.accent ?? '#F2A93B', home, away };
  }
}
</script>
</body>
</html>
