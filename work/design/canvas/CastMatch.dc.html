<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>B 경기 화면</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FFD60A}a:hover{color:#FFE566}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #08090B; color: #F4F5F7; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; align-items: stretch; height: 48px; margin: 12px 12px 0">
    <div style="flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 10px; background: #2E6B5E"><span style="font-family: 'Saira Condensed', sans-serif; font-size: 24px; font-weight: 800; font-style: italic; color: #F3EBD2">CAS</span></div>
    <div style="width: 92px; display: flex; align-items: center; justify-content: center; background: #F4F5F7; color: #08090B; font-family: 'Saira Condensed', sans-serif; font-size: 32px; font-weight: 800; font-style: italic">2 - 1</div>
    <div style="flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #4A3F7A"><span style="font-family: 'Saira Condensed', sans-serif; font-size: 24px; font-weight: 800; font-style: italic; color: #F7D9CE">RIB</span></div>
    <div style="width: 58px; display: flex; align-items: center; justify-content: center; background: {{accent}}; color: #0A0A0A; font-family: 'Saira Condensed', sans-serif; font-size: 22px; font-weight: 800; font-style: italic">74'</div>
  </div>
  <div style="position: relative; margin: 10px 0 0; height: 238px; background: #17402F; overflow: hidden" role="img" aria-label="경기 진행 2D 피치">
    <div style="position: absolute; left: 8px; right: 8px; top: 8px; bottom: 8px; border: 2px solid rgba(255,255,255,.3)"></div>
    <div style="position: absolute; left: 194px; top: 8px; bottom: 8px; width: 2px; background: rgba(255,255,255,.3)"></div>
    <div style="position: absolute; left: 160px; top: 85px; width: 68px; height: 68px; border-radius: 36px; border: 2px solid rgba(255,255,255,.3)"></div>
    <sc-for list="{{home}}" as="p" hint-placeholder-count="11"><span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 22px; height: 22px; border-radius: 11px; background: #2E6B5E; border: 2px solid #F3EBD2; color: #fff; font-family: 'Saira Condensed', sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-sizing: border-box">{{p.n}}</span></sc-for>
    <sc-for list="{{away}}" as="p" hint-placeholder-count="11"><span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 22px; height: 22px; border-radius: 11px; background: #4A3F7A; border: 2px solid #F7D9CE; color: #fff; font-family: 'Saira Condensed', sans-serif; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-sizing: border-box">{{p.n}}</span></sc-for>
    <span style="position: absolute; left: 300px; top: 104px; width: 9px; height: 9px; border-radius: 5px; background: #fff; box-shadow: 0 0 0 3px rgba(255,214,10,.7)"></span>
    <div style="position: absolute; left: 0; bottom: 14px; display: flex; align-items: stretch; height: 40px; transform: skewX(-10deg); margin-left: -6px">
      <span style="width: 70px; background: {{accent}}; color: #0A0A0A; display: flex; align-items: center; justify-content: center; font-family: 'Saira Condensed', sans-serif; font-size: 20px; font-weight: 800; font-style: italic">GOAL</span>
      <span style="display: flex; align-items: center; padding: 0 14px; background: #08090B; font-size: 14px; font-weight: 900">9 오르테가 · 시즌 7호</span>
    </div>
  </div>
  <div style="margin: 12px 12px 0; background: #15171B">
    <div style="display: flex; justify-content: space-between; padding: 6px 12px; background: #1F2227; font-family: 'Saira Condensed', sans-serif; font-size: 13px; font-weight: 800; font-style: italic; letter-spacing: 1px; color: #A9AFB8"><span>CAS</span><span>MATCH STATS</span><span>RIB</span></div>
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 10px; padding: 7px 12px">
        <b style="width: 40px; font-family: 'Saira Condensed', sans-serif; font-size: 20px; font-style: italic">{{s.a}}</b>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 12px; color: #A9AFB8; text-align: center">{{s.l}}</span><div style="display: flex; height: 6px; gap: 2px"><span style="width: {{s.p}}%; background: {{accent}}"></span><span style="flex: 1; background: #4B5058"></span></div></div>
        <b style="width: 40px; text-align: right; font-family: 'Saira Condensed', sans-serif; font-size: 20px; font-style: italic">{{s.b}}</b>
      </div>
    </sc-for>
  </div>
  <div style="margin: 10px 12px 0; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: stretch; height: 34px; background: #15171B"><span style="width: 44px; display: flex; align-items: center; justify-content: center; background: #1F2227; font-family: 'Saira Condensed', sans-serif; font-size: 15px; font-weight: 800; font-style: italic">74'</span><span style="display: flex; align-items: center; padding: 0 10px; font-size: 13px">오르테가 골 · 비달레 도움</span></div>
    <div style="display: flex; align-items: stretch; height: 34px; background: #15171B"><span style="width: 44px; display: flex; align-items: center; justify-content: center; background: #1F2227; font-family: 'Saira Condensed', sans-serif; font-size: 15px; font-weight: 800; font-style: italic">68'</span><span style="display: flex; align-items: center; padding: 0 10px; font-size: 13px; color: #A9AFB8">교체 · 몬테로 ↔ 피에리</span></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 20px; display: grid; grid-template-columns: 60px repeat(2, minmax(0, 1fr)) 100px; gap: 6px; background: #08090B">
    <button style="height: 50px; border: 0; background: #15171B; color: #F4F5F7; font-family: 'Saira Condensed', sans-serif; font-size: 20px; font-weight: 800; font-style: italic">×4</button>
    <button style="height: 50px; border: 0; background: #15171B; color: #F4F5F7; font-size: 14px; font-weight: 700; font-family: inherit">지시</button>
    <button style="height: 50px; border: 0; background: #15171B; color: #F4F5F7; font-size: 14px; font-weight: 700; font-family: inherit">전술·교체</button>
    <button style="height: 50px; border: 0; background: {{accent}}; color: #0A0A0A; font-family: 'Saira Condensed', sans-serif; font-size: 18px; font-weight: 800; font-style: italic">FULL TIME ›</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFD60A","options":["#FFD60A","#3DDC97","#5AB0F0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const home = [[14,108,1],[60,30,2],[56,84,4],[56,134,5],[62,186,3],[124,64,8],[110,110,6],[140,160,10],[236,40,11],[290,96,9],[232,180,7]].map(([x,y,n]) => ({ x, y, n }));
    const away = [[354,108,1],[316,40,2],[324,88,4],[324,134,5],[312,182,3],[272,74,6],[270,146,8],[218,64,11],[190,116,10],[216,166,7],[166,98,9]].map(([x,y,n]) => ({ x, y, n }));
    const stats = [{ l: '점유율', a: '54%', b: '46%', p: 54 }, { l: '슈팅', a: '13', b: '8', p: 62 }, { l: '기대 득점 xG', a: '1.84', b: '0.92', p: 67 }, { l: '패스 성공', a: '86%', b: '81%', p: 52 }];
    return { accent: this.props.accent ?? '#FFD60A', home, away, stats };
  }
}
</script>
</body>
</html>
