<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>온보딩 A 지도</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2A93B}a:hover{color:#FFC46B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1419; color: #E8EEF2; font-family: 'IBM Plex Sans KR', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px">
    <button aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2A3A47; background: #17212A; color: #E8EEF2; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="display: flex; gap: 6px" aria-label="5단계 중 3단계">
      <span style="width: 18px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
      <span style="width: 18px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
      <span style="width: 18px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
      <span style="width: 18px; height: 4px; border-radius: 2px; background: #2A3A47"></span>
      <span style="width: 18px; height: 4px; border-radius: 2px; background: #2A3A47"></span>
    </div>
    <span style="width: 44px; font-size: 13px; color: #9AAAB6; text-align: right">3/5</span>
  </div>
  <div style="padding: 8px 16px 12px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.35">어느 나라에서<br>감독 생활을 시작할까요?</h1>
    <p style="margin: 6px 0 0; font-size: 13px; color: #9AAAB6">나라를 누르면 리그와 구단을 볼 수 있습니다</p>
  </div>
  <div style="position: relative; margin: 0 16px; height: 330px; border-radius: 16px; background: #121B22; border: 1px solid #22303B; overflow: hidden">
    <div style="position: absolute; left: 40px; top: 40px; width: 150px; height: 120px; border-radius: 48px 70px 40px 90px; background: #1A2833"></div>
    <div style="position: absolute; left: 150px; top: 20px; width: 170px; height: 150px; border-radius: 80px 50px 90px 40px; background: #1A2833"></div>
    <div style="position: absolute; left: 30px; top: 170px; width: 140px; height: 110px; border-radius: 60px 40px 70px 50px; background: #1A2833"></div>
    <div style="position: absolute; left: 180px; top: 180px; width: 120px; height: 120px; border-radius: 40px 70px 50px 80px; background: #1A2833"></div>
    <button style="position: absolute; left: 62px; top: 206px; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; border: 2px solid {{accent}}; background: #0E1419; color: #E8EEF2; font-size: 13px; font-weight: 700; font-family: inherit">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>스페인
    </button>
    <button style="position: absolute; left: 74px; top: 92px; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #3A4C5A; background: #17212A; color: #C9D4DC; font-size: 13px; font-family: inherit">잉글랜드</button>
    <button style="position: absolute; left: 196px; top: 82px; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #3A4C5A; background: #17212A; color: #C9D4DC; font-size: 13px; font-family: inherit">독일</button>
    <button style="position: absolute; left: 138px; top: 148px; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #3A4C5A; background: #17212A; color: #C9D4DC; font-size: 13px; font-family: inherit">프랑스</button>
    <button style="position: absolute; left: 214px; top: 226px; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #3A4C5A; background: #17212A; color: #C9D4DC; font-size: 13px; font-family: inherit">이탈리아</button>
    <div style="position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px">
      <button aria-label="확대" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2A3A47; background: #17212A; color: #E8EEF2; font-size: 20px">+</button>
      <button aria-label="축소" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2A3A47; background: #17212A; color: #E8EEF2; font-size: 20px">−</button>
    </div>
  </div>
  <div style="margin: 12px 16px 0; padding: 14px 16px; border-radius: 16px; background: #17212A; border: 1px solid #2A3A47; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 17px; font-weight: 700">스페인</span>
      <span style="font-size: 13px; color: #9AAAB6">1부 20팀 · 2부 22팀</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; min-height: 44px; border-radius: 12px; border: 2px solid {{accent}}; background: #241E14; color: #E8EEF2; font-size: 13px; font-weight: 700; font-family: inherit">1부 리그</button>
      <button style="flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid #2A3A47; background: transparent; color: #C9D4DC; font-size: 13px; font-family: inherit">2부 리그</button>
    </div>
    <div style="font-size: 13px; color: #9AAAB6">처음이라면 <b style="color: #E8EEF2">2부 리그</b>에서 승격을 노리는 길도 좋습니다</div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px">
    <button style="width: 100%; height: 52px; border-radius: 14px; border: 0; background: {{accent}}; color: #1A1206; font-size: 17px; font-weight: 700; font-family: inherit">구단 고르기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2A93B","options":["#F2A93B","#4FB8C9","#8E7CF0"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F2A93B' };
  }
}
</script>
</body>
</html>
