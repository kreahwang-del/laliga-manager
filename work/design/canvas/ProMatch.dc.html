<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>B+ 경기 정교화</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#F5D547}a:hover{color:#FFE680}
@keyframes lt-in{0%{transform:translateX(-110%)}18%{transform:translateX(0)}100%{transform:translateX(0)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
.lt{animation:lt-in 2.4s cubic-bezier(.2,.8,.2,1) infinite alternate}
.livedot{animation:live 1.4s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #0A0B0D; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.022) 0 1px, transparent 1px 10px); color: #F2F3F5; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="margin: 16px 16px 0; filter: drop-shadow(0 10px 18px rgba(0,0,0,.6))">
    <div style="display: flex; height: 50px">
      <div style="flex: 1; background: #2E6B5E; clip-path: polygon(0 0, 100% 0, 100% 100%, 4% 100%); display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,.18)">
        <span style="font-family: 'Big Shoulders Display', sans-serif; font-size: 26px; font-weight: 900; font-style: italic; color: #F3EBD2">CAS</span>
        <span style="font-family: 'Big Shoulders Display', sans-serif; font-size: 38px; font-weight: 900; color: #fff">2</span>
      </div>
      <div style="width: 3px; background: #0A0B0D"></div>
      <div style="flex: 1; background: #4A3F7A; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">
        <span style="font-family: 'Big Shoulders Display', sans-serif; font-size: 38px; font-weight: 900; color: #fff">1</span>
        <span style="font-family: 'Big Shoulders Display', sans-serif; font-size: 26px; font-weight: 900; font-style: italic; color: #F7D9CE">RIB</span>
      </div>
      <div style="width: 70px; background: #F2F3F5; color: #0A0B0D; clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%); display: flex; align-items: center; justify-content: center; font-family: 'Big Shoulders Display', sans-serif; font-size: 28px; font-weight: 900">74'</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 22px; padding: 0 10px; background: #15171B">
      <span class="livedot" style="width: 6px; height: 6px; border-radius: 3px; background: #E5484D"></span>
      <span style="font-family: 'Big Shoulders Display', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #A7ADB5">LIVE · 리그 1R</span>
      <span style="flex: 1"></span>
      <span style="font-size: 11px; color: #A7ADB5">점유</span>
      <span style="width: 84px; height: 3px; background: #4A3F7A; display: flex"><span style="width: 54%; height: 3px; background: {{accent}}"></span></span>
    </div>
  </div>
  <div style="position: relative; margin: 14px 0 0; height: 236px; background-color: #17402F; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 32px, transparent 32px 64px); overflow: hidden" role="img" aria-label="경기 진행 2D 피치">
    <div style="position: absolute; left: 10px; right: 10px; top: 10px; bottom: 10px; border: 1.5px solid rgba(255,255,255,.32)"></div>
    <div style="position: absolute; left: 194px; top: 10px; bottom: 10px; width: 1.5px; background: rgba(255,255,255,.32)"></div>
    <div style="position: absolute; left: 161px; top: 85px; width: 66px; height: 66px; border-radius: 34px; border: 1.5px solid rgba(255,255,255,.32)"></div>
    <div style="position: absolute; left: 10px; top: 64px; width: 50px; height: 108px; border: 1.5px solid rgba(255,255,255,.32); border-left: 0"></div>
    <div style="position: absolute; right: 10px; top: 64px; width: 50px; height: 108px; border: 1.5px solid rgba(255,255,255,.32); border-right: 0"></div>
    <sc-for list="{{home}}" as="p" hint-placeholder-count="11"><span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 22px; height: 22px; border-radius: 11px; background: #2E6B5E; border: 2px solid #F3EBD2; color: #fff; font-family: 'Big Shoulders Display', sans-serif; font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-sizing: border-box; box-shadow: 0 3px 6px rgba(0,0,0,.45)">{{p.n}}</span></sc-for>
    <sc-for list="{{away}}" as="p" hint-placeholder-count="11"><span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: 22px; height: 22px; border-radius: 11px; background: #4A3F7A; border: 2px solid #F7D9CE; color: #fff; font-family: 'Big Shoulders Display', sans-serif; font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-sizing: border-box; box-shadow: 0 3px 6px rgba(0,0,0,.45)">{{p.n}}</span></sc-for>
    <span style="position: absolute; left: 300px; top: 104px; width: 9px; height: 9px; border-radius: 5px; background: #fff; box-shadow: 0 0 0 4px rgba(245,213,71,.55), 0 0 14px rgba(245,213,71,.8)"></span>
    <div class="lt" style="position: absolute; left: 0; bottom: 16px; display: flex; height: 44px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.6))">
      <span style="width: 86px; display: flex; align-items: center; padding-left: 14px; box-sizing: border-box; background: {{accent}}; color: #0A0B0D; clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%); font-family: 'Big Shoulders Display', sans-serif; font-size: 26px; font-weight: 900; font-style: italic">GOAL</span>
      <span style="display: flex; flex-direction: column; justify-content: center; padding: 0 22px 0 8px; margin-left: -10px; background: #0A0B0D; clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%)"><span style="font-size: 14px; font-weight: 900">9 루이스 오르테가</span><span style="font-size: 11px; color: #A7ADB5">시즌 7호 · 도움 비달레</span></span>
    </div>
  </div>
  <div style="margin: 14px 16px 0">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 3px; color: {{accent}}">MOMENTUM</span><span style="flex: 1; height: 1px; background: linear-gradient(90deg, rgba(245,213,71,.5), transparent)"></span></div>
    <div style="display: flex; align-items: center; height: 44px; gap: 3px">
      <sc-for list="{{mom}}" as="b" hint-placeholder-count="15">
        <span style="flex: 1; display: flex; flex-direction: column; justify-content: center; height: 44px"><span style="height: {{b.up}}px; background: {{b.cu}}; align-self: stretch"></span><span style="height: 1px; background: rgba(255,255,255,.18)"></span><span style="height: {{b.dn}}px; background: {{b.cd}}; align-self: stretch"></span></span>
      </sc-for>
    </div>
  </div>
  <div style="margin: 14px 16px 0; border-top: 1px solid rgba(255,255,255,.08)">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.08)">
        <span style="font-family: 'Big Shoulders Display', sans-serif; font-size: 22px; font-weight: 900; font-style: italic">{{s.a}}</span>
        <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #8C939D; text-align: center">{{s.l}}</span><div style="display: flex; height: 3px; gap: 2px"><span style="width: {{s.p}}%; background: {{accent}}"></span><span style="flex: 1; background: #4A3F7A"></span></div></div>
        <span style="font-family: 'Big Shoulders Display', sans-serif; font-size: 22px; font-weight: 900; font-style: italic; text-align: right">{{s.b}}</span>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 22px; display: grid; grid-template-columns: 58px repeat(2, minmax(0, 1fr)) 112px; gap: 6px; background: linear-gradient(180deg, rgba(10,11,13,0), #0A0B0D 30%)">
    <button style="height: 52px; border: 0; background: rgba(255,255,255,.06); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); color: #F2F3F5; font-family: 'Big Shoulders Display', sans-serif; font-size: 22px; font-weight: 900; font-style: italic">×4</button>
    <button style="height: 52px; border: 0; background: rgba(255,255,255,.06); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); color: #F2F3F5; font-size: 14px; font-weight: 900; font-family: inherit">지시</button>
    <button style="height: 52px; border: 0; background: rgba(255,255,255,.06); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); color: #F2F3F5; font-size: 14px; font-weight: 900; font-family: inherit">전술·교체</button>
    <button style="height: 52px; border: 0; background: {{accent}}; color: #0A0B0D; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); font-family: 'Big Shoulders Display', sans-serif; font-size: 20px; font-weight: 900; font-style: italic">FULL TIME</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5D547","options":["#F5D547","#46D6A3","#5AB8F5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F5D547';
    const home = [[14,107,1],[60,30,2],[56,84,4],[56,134,5],[62,186,3],[124,64,8],[110,110,6],[140,160,10],[236,40,11],[290,96,9],[232,180,7]].map(([x,y,n]) => ({ x, y, n }));
    const away = [[354,107,1],[316,40,2],[324,88,4],[324,134,5],[312,182,3],[272,74,6],[270,146,8],[218,64,11],[190,116,10],[216,166,7],[166,98,9]].map(([x,y,n]) => ({ x, y, n }));
    const m = [4, 9, 14, 6, -5, -12, -8, 3, 10, 18, 7, -4, 12, 20, 16];
    const mom = m.map((v) => ({ up: v > 0 ? v : 0, dn: v < 0 ? -v : 0, cu: accent, cd: '#7C6BC4' }));
    const stats = [{ l: '슈팅 (유효)', a: '13', b: '8', p: 62 }, { l: '기대 득점 xG', a: '1.84', b: '0.92', p: 67 }, { l: '패스 성공률', a: '86%', b: '81%', p: 52 }];
    return { accent, home, away, mom, stats };
  }
}
</script>
</body>
</html>
